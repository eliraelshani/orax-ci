<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OraX Widget Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        margin: 0;
        padding: 2rem;
        background: #f5f7fb;
      }
      h1 {
        margin-bottom: 0.5rem;
      }
      p {
        max-width: 600px;
      }
    </style>
  </head>
  <body>
    <h1>OraX Widget Test Page</h1>
    <p>
      This is a simple page to test the OraX chat widget. A
      floating button should appear in the bottom-right corner. Click it to open
      the chat.
    </p>

    <!-- Load the OraX widget script -->
    <script src="https://dev.agenticonvo.com/orax/orax-widget.js"></script>

    <!-- Initialize the widget -->
    <script>
      window.addEventListener("load", function () {
        if (window.initiateOraxChatbot) {
          window.initiateOraxChatbot({
            tenantKey: "chlorine-institute",
          });
        } else {
          console.error("OraX widget script did not load.");
        }
      });
    </script>
  </body>
</html>
